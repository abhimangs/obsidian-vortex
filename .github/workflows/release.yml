name: Release Obsidian theme

on:
  push:
    tags:
      - "*"
    branches:
      - main
    paths:
      - manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(jq -r .version manifest.json)"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match manifest.json version '$version' (tags must not have a 'v' prefix)"
            exit 1
          fi
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists, nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.version.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" --title="$VERSION" --target "$GITHUB_SHA" --generate-notes manifest.json theme.css
